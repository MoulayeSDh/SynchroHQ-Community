name: Clean-host recovery drill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      stamp: ${{ steps.backup.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private synthetic configuration
        run: |
          umask 077
          mkdir -p /tmp/synchrohq-ci
          {
            echo POSTGRES_DB=synchrohq
            echo POSTGRES_USER=synchrohq
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo S3_ACCESS_KEY=ci-recovery-user
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)"
            echo PUBLIC_ORIGIN=https://ci.example.invalid
          } > /tmp/synchrohq-ci/production.env
      - name: Install fresh source host
        run: sudo bash deployments/community/production/install.sh /tmp/synchrohq-ci/production.env
      - name: Bootstrap a synthetic tenant and object
        run: |
          sudo docker compose --env-file /tmp/synchrohq-ci/production.env \
            -f compose.yaml -f compose.production.yaml exec -T backend python - <<'PY'
          import os
          import boto3
          from app.core.database import SessionLocal
          from app.modules.identity.bootstrap import BootstrapInput, bootstrap

          with SessionLocal.begin() as session:
              bootstrap(session, BootstrapInput(
                  'CI_RECOVERY', 'Synthetic recovery tenant', 'ci-admin@example.invalid',
                  'Synthetic administrator', 'Synthetic root', 'Synthetic office',
              ), 'Synthetic-CI-Password-123')
          s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT_URL'],
                           aws_access_key_id=os.environ['S3_ACCESS_KEY'],
                           aws_secret_access_key=os.environ['S3_SECRET_KEY'],
                           region_name=os.environ['S3_REGION'])
          bucket = os.environ['S3_BUCKET']
          try:
              s3.head_bucket(Bucket=bucket)
          except Exception:
              s3.create_bucket(Bucket=bucket)
          s3.put_object(Bucket=bucket, Key='ci/recovery-marker.txt', Body=b'SynchroHQ recovery marker')
          PY
      - name: Backup source host
        id: backup
        run: |
          deployments/community/ops/backup.sh /tmp/synchrohq-ci/backup \
            --env-file /tmp/synchrohq-ci/production.env
          manifest=$(find /tmp/synchrohq-ci/backup -maxdepth 1 -name 'sha256-*.txt' -print -quit)
          test -n "$manifest"
          stamp=${manifest##*/}
          stamp=${stamp#sha256-}
          stamp=${stamp%.txt}
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-community
          path: /tmp/synchrohq-ci/backup/*
          if-no-files-found: error
          retention-days: 1

  target:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synthetic-recovery-community
          path: /tmp/synchrohq-ci/backup
      - name: Prepare independent private configuration
        run: |
          umask 077
          {
            echo POSTGRES_DB=synchrohq
            echo POSTGRES_USER=synchrohq
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo S3_ACCESS_KEY=ci-recovery-user
            echo "S3_SECRET_KEY=$(openssl rand -hex 24)"
            echo "AUTH_JWT_SECRET=$(openssl rand -hex 32)"
            echo PUBLIC_ORIGIN=https://ci.example.invalid
          } > /tmp/synchrohq-ci/production.env
      - name: Restore into an empty target host
        run: |
          sudo bash deployments/community/production/restore-new-host.sh \
            /tmp/synchrohq-ci/production.env /tmp/synchrohq-ci/backup \
            '${{ needs.source.outputs.stamp }}'
      - name: Verify restored login, session and object
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:8001/api/session'
          credentials = json.dumps({'identifier': 'ci-admin@example.invalid',
                                    'password': 'Synthetic-CI-Password-123'}).encode()
          req = urllib.request.Request(base + '/login', data=credentials,
                                       headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['token']
          headers = {'Authorization': 'Bearer ' + token}
          with urllib.request.urlopen(urllib.request.Request(base, headers=headers)) as response:
              identity = json.load(response)
          assert identity['tenant_id']
          with urllib.request.urlopen(urllib.request.Request(
                  base + '/logout', data=b'', headers=headers, method='POST')) as response:
              assert response.status == 204
          try:
              urllib.request.urlopen(urllib.request.Request(base, headers=headers))
          except urllib.error.HTTPError as error:
              assert error.code == 401
          else:
              raise AssertionError('Revoked session still accepted')
          print('Restored admin login and session revocation: PASS')
          PY
          sudo docker compose --env-file /tmp/synchrohq-ci/production.env \
            -f compose.yaml -f compose.production.yaml exec -T backend python - <<'PY'
          import os
          import boto3
          s3 = boto3.client('s3', endpoint_url=os.environ['S3_ENDPOINT_URL'],
                           aws_access_key_id=os.environ['S3_ACCESS_KEY'],
                           aws_secret_access_key=os.environ['S3_SECRET_KEY'],
                           region_name=os.environ['S3_REGION'])
          data = s3.get_object(Bucket=os.environ['S3_BUCKET'],
                               Key='ci/recovery-marker.txt')['Body'].read()
          assert data == b'SynchroHQ recovery marker'
          print('Restored object storage: PASS')
          PY
