# Load after compose.yaml. No development credentials or public container ports.
services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synchrohq}
      POSTGRES_USER: ${POSTGRES_USER:-synchrohq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports: !override []
    restart: unless-stopped
  minio:
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
    ports: !override []
    restart: unless-stopped
  backend:
    environment:
      APP_ENV: production
      DEMO_LOGIN_ENABLED: 'false'
      POSTGRES_DB: ${POSTGRES_DB:-synchrohq}
      POSTGRES_USER: ${POSTGRES_USER:-synchrohq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY required}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN required}
    ports: !override
      - '127.0.0.1:${API_HOST_PORT:-8001}:8000'
    restart: unless-stopped
  frontend:
    ports: !override
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    restart: unless-stopped
